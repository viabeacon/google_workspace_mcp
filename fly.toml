app = 'ao-google-workspace'
primary_region = 'dfw'

[build]

[env]
  WORKSPACE_MCP_CREDENTIALS_DIR = '/data/store_creds'
  WORKSPACE_EXTERNAL_URL = 'https://ao-google-workspace.fly.dev'
  TOOLS = 'drive docs sheets slides'
  TOOL_TIER = 'complete'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'store_creds'
  destination = '/data/store_creds'
